# =============================================================================
# Maestro — Banka içi (internetsiz) kurulum
# BUNDLE_VERSION: 2026-08-16
# =============================================================================
# Bu compose HİÇBİR ŞEY BUILD ETMEZ. Tüm imajlar `docker load` ile yüklenmiş
# ya da kurum registry'sinden çekilmiş olmalıdır (bkz. README.md §1).
#
# Geliştirme compose'undan (../compose.yaml) farkı:
#   - `build:` yok, `image:` var  → internetsiz sunucuda derleme yapılamaz
#   - imaj adresleri .env'de       → registry/etiket değişince compose'a dokunulmaz
#   - node imajı TEK              → BFF/worker/migrate rolleri MAESTRO_ENTRYPOINT ile ayrılır
#   - studio → bff proxy'si       → tarayıcının /api çağrıları BFF'e gider
#
# ⚠ BURADA OLMAYAN DEĞİŞKEN, KONTEYNERE GİRMEZ.
#   .env'de dolu olması yetmez: bir değişken aşağıdaki `environment:` bloğunda
#   ADIYLA yazılı değilse süreç onu hiç görmez. Bu, paketin geçmişte en pahalı
#   arıza biçimiydi — operatör .env'de değeri görür, sistem ise sanki hiç
#   yazılmamış gibi davranır. Yeni bir ayar eklerken .env.example'a yazmak
#   YARIM iştir; buraya da eklenmelidir.
#
# Kurulum:  cp .env.example .env && <doldur> && ./install.sh
# =============================================================================

# Yığının adı. Konteyner, ağ ve VOLUME adlarının tamamı bunun önekiyle üretilir
# (`maestro_postgres-data` gibi), dolayısıyla bu satır "hangi veritabanı" demenin
# bir başka biçimidir.
#
# .env'den gelir ÇÜNKÜ aynı sunucuda ikinci bir kurulum (kabul/test ortamı,
# sürüm provası) yapmak sabit bir adla mümkün değildir: iki kurulum da `maestro`
# adını alır, compose ikincisini yeni bir yığın olarak değil MEVCUDUN GÜNCELLEMESİ
# olarak görür ve çalışan kurulumun volume'üne bağlanır. Sonuç, "yeni bir kurulum
# denedim" ile "üretim veritabanının üstüne kuruldum" arasındaki farkın
# kaybolmasıdır. Varsayılanı `maestro`'dur, yani tek kurulumlu bir sunucuda
# hiçbir şey değişmez.
name: ${COMPOSE_PROJECT_NAME:-maestro}

# ── Ortak sertleştirme ───────────────────────────────────────────────────────
# Geliştirme compose'undaki ayarların aynısı. Değiştirmeyin: imajlar uid 10001
# ile çalışır, kök dosya sistemine yazmaz.
x-node-hardening: &node-hardening
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  user: "10001:10001"
  cap_drop:
    - ALL
  read_only: true
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=64m
  logging: &default-logging
    driver: "json-file"
    options:
      max-size: "100m"
      max-file: "10"

# ── Tüm Node servislerinin paylaştığı ortam ──────────────────────────────────
x-node-env: &node-env
  # NODE_ENV .env'den GELİR, burada sabitlenmez.
  #
  # Eski sürümde burada `production` yazılıydı ve paket hiç açılamıyordu:
  # sırlar env-file sürücüsüyle okunur, o sürücü ise NODE_ENV=production
  # altında yapıcısında (constructor) reddeder (M6/M80).
  #
  # MAESTRO_PROFILE ARTIK YOKTUR ve bu bilinçli bir sadeleştirmedir.
  # Altyapı profili bu değerden TÜRETİLİR (apps/deploy/src/env.ts): production
  # ise Vault + S3, değilse env-file + Postgres. Ayrı bir değişken olduğu
  # sürece ikisi çelişebiliyordu ve çelişki açılışta ölümle sonuçlanıyordu.
  #
  # Daha önemlisi: profil, ürünün NE YAPABİLECEĞİNE de karar veriyordu.
  # `analiz` profili scm/ci/tarama portlarını REDDEDEN sürücülere bağlardı;
  # panel "Hata düzeltme" akışını yine de sunar, kural yazılır, koşu başlar ve
  # analiz yazılıp insan onayı alındıktan SONRA mühendislik adımında ölürdü.
  # Artık kod hattı her kurulumda kuruludur; "bu kurulum kod yazabilir mi"
  # sorusunun cevabı panelden eklenen BAĞLANTIDIR ve sihirbaz bunu daha ilk
  # adımda söyler.
  NODE_ENV: ${NODE_ENV:-development}
  DATABASE_URL: postgresql://${POSTGRES_USER:?POSTGRES_USER gerekli}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD gerekli}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB gerekli}
  TEMPORAL_ADDRESS: temporal:7233
  TEMPORAL_NAMESPACE: ${TEMPORAL_NAMESPACE:-default}
  REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD gerekli}@redis:6379/0

  # Panelden girilen bağlantı jetonlarını şifreleyen anahtar. production'da
  # yokluğu açılışı durdurur; development'ta yoksa kod türetilmiş bir DEV
  # anahtarı üretip uyarır — yani jetonlar gerçekte korunmaz. Bankada her iki
  # durumda da dolu olmalıdır, bu yüzden `:?` ile zorunlu tutuluyor.
  CONNECTOR_MASTER_KEY: ${CONNECTOR_MASTER_KEY:?CONNECTOR_MASTER_KEY gerekli — openssl rand -base64 32}

  # Kurumsal TLS: banka kendi CA'sıyla imzalı Jira DC / TFS sertifikası
  # kullanıyorsa bu ŞART. Yoksa her çağrı "unable to verify the first
  # certificate" ile düşer. Dosya aşağıda mount ediliyor.
  NODE_EXTRA_CA_CERTS: ${NODE_EXTRA_CA_CERTS:-}

  # ── İş takibi (Jira) ───────────────────────────────────────────────────────
  # HANGİ SÜRÜCÜ ÇALIŞACAĞINI BU İKİ ADRES BELİRLER — ayrı bir seçici yoktur.
  # Yalnızca birini doldurun:
  #   JIRA_BASE_URL       → Data Center sürücüsü (`Bearer <PAT>`)
  #   JIRA_CLOUD_BASE_URL → Cloud sürücüsü (`Basic <e-posta>:<jeton>`)
  # İkisi birden doluysa açılış ADIYLA reddedilir; hangisinin kazandığı tahmin
  # edilmez. İkisi de boşsa yığın yine AÇILIR (panel erişilebilir kalsın diye)
  # ve Jira'ya ilk erişimde "henüz tanımlanmadı" diye adıyla cevap verir.
  #
  # ⚠ `WORK_DRIVER` KALDIRILDI. Burada `${WORK_DRIVER:-jira-dc}` yazıyordu, yani
  #   HER kurulumda doluydu ve profili maskeliyordu: Cloud kullanan bir saha,
  #   adresini doğru yazsa bile Data Center sürücüsüne düşüyordu. Kaldığı yerde
  #   iki ayrı kod yolu (boot ve compose) bu değişkeni farklı okuyabiliyordu.
  # ⚠ JIRA_BASE_URL artık `:?` ile ZORUNLU DEĞİLDİR — zorunlu olsaydı Cloud
  #   kullanan bir kurulum, kullanmadığı bir Data Center adresi yazmadan
  #   açılamazdı. Zaten tam olarak bu yüzden canlı sistem düşmüştü.
  JIRA_BASE_URL: ${JIRA_BASE_URL:-}
  JIRA_CLOUD_BASE_URL: ${JIRA_CLOUD_BASE_URL:-}
  JIRA_TOKEN_REF: ${JIRA_TOKEN_REF:-kv/jira#token}
  JIRA_WEBHOOK_SECRET_REF: ${JIRA_WEBHOOK_SECRET_REF:-kv/jira#webhook}

  # ── Motorun Jira kimliği ───────────────────────────────────────────────────
  # Keşif sorgusu `assignee = "<MAESTRO_BOT_ACCOUNT_ID>"` ile çalışır; panel
  # ise dinleme kuralını BAĞLANTININ sahibiyle doldurur. İkisi ayrışırsa her
  # kural eşleşmeyen bir atanana bakar ve HİÇBİR HATA ÜRETMEDEN hiçbir şey
  # yakalamaz. Bu yüzden ikisi de konteynere girmek zorundadır: BFF bu değeri
  # yalnızca bağlantı testinde karşılaştırıp uyarmak için okur ve değişken
  # konteynere ulaşmazsa uyarı da hiç çıkmaz.
  MAESTRO_BOT_ACCOUNT_ID: ${MAESTRO_BOT_ACCOUNT_ID:-}
  # Cloud'da Basic kimlik doğrulamanın kullanıcı adı. Boşsa kod
  # JIRA_CLOUD_EMAIL'e düşer (driver-config.ts) — canlıda iki kimliğin
  # ayrışma yolu tam olarak buydu.
  MAESTRO_BOT_EMAIL: ${MAESTRO_BOT_EMAIL:-}
  JIRA_CLOUD_EMAIL: ${JIRA_CLOUD_EMAIL:-}

  # ── Kaynak kodu ────────────────────────────────────────────────────────────
  # scm portu GitHub sürücüsüdür ve HER kurulumda kuruludur. Hiçbir zorunlu
  # değişkeni yoktur: github.com varsayılandır, jeton ise ilk çağrıda okunur.
  # Böylece deposu henüz tanımlanmamış bir kurulum da açılır ve analiz hattını
  # uçtan uca çalıştırır — eksik depo, açılışta ölüm değil, panelde görünen ve
  # panelden düzeltilebilen bir eksiktir.
  #
  # GITHUB_TOKEN_REF bir sır ADRESİDİR, sır değeri değil (§11/§12).
  GITHUB_TOKEN_REF: ${GITHUB_TOKEN_REF:-kv/github#token}
  # Yalnızca GitHub Enterprise Server için; ikisi BİRLİKTE verilir. Boş
  # bırakılırsa github.com kullanılır.
  GITHUB_API_BASE_URL: ${GITHUB_API_BASE_URL:-}
  GITHUB_GRAPHQL_URL: ${GITHUB_GRAPHQL_URL:-}

  # Azure DevOps kullanan bir saha için; scm portu GitHub olduğundan bunlar
  # bugün okunmaz, ama CI tarafı yapılandırıldığında aynı adlardan okunur.
  ADO_BASE_URL: ${ADO_BASE_URL:-}
  ADO_ORG: ${ADO_ORG:-}
  ADO_PROJECT: ${ADO_PROJECT:-}
  ADO_PR_VALIDATION_BUILDS: ${ADO_PR_VALIDATION_BUILDS:-}
  ADO_TOKEN_REF: ${ADO_TOKEN_REF:-kv/ado#token}
  ADO_WEBHOOK_SECRET_REF: ${ADO_WEBHOOK_SECRET_REF:-kv/ado#webhook}

  # ── Yapay zekâ uç noktası (kurum içi) ──────────────────────────────────────
  # DİKKAT: LLM_BASE_URL sonunda `/v1` OLMAYACAK — sürücü kendisi ekler.
  LLM_BASE_URL: ${LLM_BASE_URL:?LLM_BASE_URL gerekli — sonunda /v1 OLMADAN}
  LLM_MODEL: ${LLM_MODEL:?LLM_MODEL gerekli}
  LLM_API_KEY_REF: ${LLM_API_KEY_REF:-kv/llm#api-key}
  # Uç nokta gerçekten kurum içindeyse true. false kalırsa `gizli` sınıflı
  # işler on-prem model yok sayılır ve analiz "elle tamamlayın" diye bozularak
  # biter — hata değil, EKSİK ÇIKTI.
  LLM_ON_PREM: ${LLM_ON_PREM:?LLM_ON_PREM gerekli — kurum içi endpoint icin true}

  # ── Kimlik (LDAP/AD) ───────────────────────────────────────────────────────
  # Varsayılan `local`: pilot kurulum yerel hesapla başlar, LDAP sonradan
  # devreye alınır. `ldaps-bind` seçilirse LDAP_URL + LDAP_USER_BASE_DN +
  # LDAP_BIND_DN zorunlu olur ve süreç bunlarsız açılmaz.
  IDENTITY_DRIVER: ${IDENTITY_DRIVER:-local}
  LDAP_URL: ${LDAP_URL:-}
  # Kodun okuduğu ad LDAP_USER_BASE_DN'dir. Eski paketteki `LDAP_BASE_DN` hiçbir
  # şema tarafından okunmuyordu: LDAP dolu görünüp hiç çalışmıyordu.
  LDAP_USER_BASE_DN: ${LDAP_USER_BASE_DN:-}
  LDAP_GROUP_BASE_DN: ${LDAP_GROUP_BASE_DN:-}
  LDAP_BIND_DN: ${LDAP_BIND_DN:-}
  LDAP_BIND_PASSWORD_REF: ${LDAP_BIND_PASSWORD_REF:-kv/ldap#service-password}
  LDAP_CA_CERT_PATH: ${LDAP_CA_CERT_PATH:-}
  LDAP_USER_FILTER: ${LDAP_USER_FILTER:-}
  LDAP_GROUP_FILTER: ${LDAP_GROUP_FILTER:-}
  LDAP_ROLE_MAPPINGS: ${LDAP_ROLE_MAPPINGS:-}

  # ── Vault (yalnızca NODE_ENV=production) ──────────────────────────────────
  # Sır sürücüsü ORTAM DEĞİŞKENİYLE SEÇİLMEZ; profilden gelir
  # (apps/deploy/src/profile.ts). Eski paketteki `SECRET_DRIVER` değişkenini
  # hiçbir kod okumuyordu — kaldırıldı, çünkü okunmayan bir değişken operatöre
  # yanlış bir seçim yaptığını düşündürür.
  VAULT_ADDR: ${VAULT_ADDR:-}
  VAULT_ROLE_ID: ${VAULT_ROLE_ID:-}
  VAULT_SECRET_ID: ${VAULT_SECRET_ID:-}
  VAULT_MOUNTS: ${VAULT_MOUNTS:-kv,git}

  # ── Depolama (yalnızca NODE_ENV=production) ───────────────────────────────
  # NODE_ENV=development iken belgeler Postgres'te tutulur (`pg-blob`).
  STORAGE_ENDPOINT: ${STORAGE_ENDPOINT:-}
  STORAGE_BUCKET: ${STORAGE_BUCKET:-maestro-evidence}
  STORAGE_REGION: ${STORAGE_REGION:-us-east-1}

# Sır değerleri (env-file sürücüsü için). Ayrı anchor: yalnızca uygulama
# servislerine verilir, veritabanı/temporal konteynerlerine sızmaz.
#
# ⚠ BU ADLAR ELLE SEÇİLMEZ. Sürücü değişken adını referanstan türetir
#   (packages/secrets/src/keys.ts): `kv/jira#token` → MAESTRO_SECRET_KV_JIRA__TOKEN,
#   '#' ÇİFT alt çizgi, '-' ise `__2D_` olur. Eski paketteki
#   MAESTRO_SECRET_JIRA_TOKEN gibi adlar hiçbir zaman aranmıyordu; sürücü
#   "secret not found" derken operatör .env'de değeri dolu görüyordu.
x-node-secrets: &node-secrets
  MAESTRO_SECRET_KV_JIRA__TOKEN: ${MAESTRO_SECRET_KV_JIRA__TOKEN:-}
  MAESTRO_SECRET_KV_JIRA__WEBHOOK: ${MAESTRO_SECRET_KV_JIRA__WEBHOOK:-}
  MAESTRO_SECRET_KV_LLM__API__2D_KEY: ${MAESTRO_SECRET_KV_LLM__API__2D_KEY:-}
  MAESTRO_SECRET_KV_ADO__TOKEN: ${MAESTRO_SECRET_KV_ADO__TOKEN:-}
  MAESTRO_SECRET_KV_ADO__WEBHOOK: ${MAESTRO_SECRET_KV_ADO__WEBHOOK:-}
  MAESTRO_SECRET_KV_LDAP__SERVICE__2D_PASSWORD: ${MAESTRO_SECRET_KV_LDAP__SERVICE__2D_PASSWORD:-}

# Kurumsal CA + LDAP CA dosyalarını salt-okunur mount et.
x-ca-volumes: &ca-volumes
  - ${CA_BUNDLE_DIR:-./certs}:/etc/maestro:ro

services:

  # ───────────────────────────────────────────────────────────────────────────
  # Veri katmanı
  # ───────────────────────────────────────────────────────────────────────────
  postgres:
    image: ${POSTGRES_IMAGE:?POSTGRES_IMAGE gerekli (.env)}
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER gerekli}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD gerekli}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB gerekli}
      # Kurum dili/collation'ı önemliyse burada sabitleyin.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [maestro]

  redis:
    image: ${REDIS_IMAGE:?REDIS_IMAGE gerekli (.env)}
    restart: unless-stopped
    logging: *default-logging
    # Parolasız Redis, ağa açık bir kuyruktur. Parola ZORUNLU.
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD gerekli}", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [maestro]

  temporal:
    image: ${TEMPORAL_IMAGE:?TEMPORAL_IMAGE gerekli (.env)}
    restart: unless-stopped
    logging: *default-logging
    environment:
      DB: postgres12
      DB_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PWD: ${POSTGRES_PASSWORD}
      POSTGRES_SEEDS: postgres
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "tctl", "--address", "temporal:7233", "cluster", "health"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 60s
    networks: [maestro]

  # ───────────────────────────────────────────────────────────────────────────
  # Şema kurulumu — BFF'ten ÖNCE çalışır ve bitmesi beklenir
  # ───────────────────────────────────────────────────────────────────────────
  migrate:
    <<: *node-hardening
    image: ${MAESTRO_NODE_IMAGE:?MAESTRO_NODE_IMAGE gerekli (.env)}
    restart: "no"
    environment:
      <<: [*node-env, *node-secrets]
      # Tek imaj, üç rol: entrypoint env ile seçilir.
      MAESTRO_ENTRYPOINT: apps/deploy/src/bin/migrate.ts
    volumes: *ca-volumes
    depends_on:
      postgres:
        condition: service_healthy
    networks: [maestro]

  # ───────────────────────────────────────────────────────────────────────────
  # Uygulama
  # ───────────────────────────────────────────────────────────────────────────
  bff:
    <<: *node-hardening
    image: ${MAESTRO_NODE_IMAGE:?MAESTRO_NODE_IMAGE gerekli (.env)}
    environment:
      <<: [*node-env, *node-secrets]
      MAESTRO_ENTRYPOINT: apps/deploy/src/bin/bff.ts
      # 7001 SABİT — .env'den GELMEZ, ve bu bilinçli bir kısıtlamadır.
      #
      # Bu, BFF'in KONTEYNER İÇİNDEKİ dinleme portudur; dışarıya hiç
      # yayınlanmaz (`ports:` yalnızca studio'da vardır). Yani operatörün onu
      # değiştirmekle kazanacağı hiçbir şey yoktur — kaybedeceği şey ise
      # yığının tamamıdır: bu port iki ayrı yerde daha, SABİT olarak yazılıdır.
      #   1) aşağıdaki healthcheck  → 127.0.0.1:7001/readyz
      #   2) studio-nginx.conf      → proxy_pass http://bff:7001/
      # Değişken buradan besleniyorken .env'de BFF_PORT="17011" yazan bir
      # kurulum tam olarak şunu yaşadı: süreç 17011'i dinledi, healthcheck
      # 7001'i yokladı, konteyner hiç 'healthy' olmadı ve studio ona bağımlı
      # olduğu için hiç başlamadı. Panel açılsaydı bile her /api çağrısı 502
      # dönecekti. Tek bir değişkeni değiştirmenin bedeli, açılmayan bir yığın.
      #
      # Dışarıya açılan tek port STUDIO_PORT'tur; değiştirilecek port odur.
      BFF_PORT: "7001"
      # Kodun varsayılanı 127.0.0.1'dir ve bu bilinçlidir: değişken unutulduğu
      # için 0.0.0.0'a bağlanan servis, ihmal yüzünden ağa açılmış demektir.
      # Konteyner içinde loopback'i studio'nun nginx'i göremez — panel açılır,
      # her istek 502 döner. Varsayılan burada 0.0.0.0'dır ÇÜNKÜ maruziyet
      # konteyner ağıyla sınırlıdır; dışarıya açılan tek şey STUDIO_PORT'tur.
      BFF_HOST: ${BFF_HOST:-0.0.0.0}
    volumes: *ca-volumes
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      temporal: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    healthcheck:
      # /readyz — Temporal ve kill-switch deposunu da yoklar; "süreç ayakta mı"
      # değil "istek çalışır mı" sorusunu yanıtlar.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:7001/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 40s
    networks: [maestro]

  worker:
    <<: *node-hardening
    image: ${MAESTRO_NODE_IMAGE:?MAESTRO_NODE_IMAGE gerekli (.env)}
    environment:
      <<: [*node-env, *node-secrets]
      MAESTRO_ENTRYPOINT: apps/deploy/src/bin/worker.ts
    volumes: *ca-volumes
    depends_on:
      temporal: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    # Worker HTTP sunmaz; canlılık = süreç ayakta (restart politikası korur).
    healthcheck:
      test: ["NONE"]
    networks: [maestro]

  studio:
    image: ${MAESTRO_STUDIO_IMAGE:?MAESTRO_STUDIO_IMAGE gerekli (.env)}
    restart: unless-stopped
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    # Tarayıcı /api/... çağırır, BFF ise kökten servis eder (/auth/login).
    # Bu conf öneki soyup bff'e yönlendirir. Dev'de bu işi Vite yapıyordu;
    # üretimde nginx yapar. Dosya olmadan panel açılır ama HİÇBİR istek çalışmaz.
    volumes:
      - ./studio-nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      bff:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    ports:
      - "${STUDIO_PORT:-7000}:8080"
    networks: [maestro]

volumes:
  postgres-data:
  redis-data:

networks:
  maestro:
    driver: bridge
