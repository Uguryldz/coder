# Maestro Studio — üretim nginx yapılandırması (banka kurulumu)
#
# İmajın içindeki varsayılan conf yalnızca statik dosya servis eder. Tarayıcı
# ise API çağrılarını `/api/...` altına yapar (apps/studio/src/api/client.ts:41),
# BFF ise rotalarını KÖKTEN servis eder (/auth/login, /runs, ...). Arada öneki
# soyan bir proxy yoksa panel açılır ama hiçbir istek çalışmaz — giriş ekranında
# "sunucuya ulaşılamıyor" olarak görünür.
#
# Geliştirmede bu işi Vite'ın dev proxy'si yapar (apps/studio/vite.config.ts).
# Üretimde nginx yapar. Bu dosya compose tarafından mount edilir.

server {
    listen       8080;
    server_name  _;

    root         /usr/share/nginx/html;
    index        index.html;

    # Güvenlik başlıkları — imajın kendi conf'undakiyle aynı.
    add_header X-Content-Type-Options   "nosniff"     always;
    add_header X-Frame-Options          "DENY"        always;
    add_header Referrer-Policy          "same-origin" always;

    # Yükleme boyutu: Word şablonu ve bilgi kütüphanesi belgeleri buradan geçer.
    # (nginx conf'unda env genişletmesi yoktur; büyütmek gerekirse bu satırı
    # elle değiştirip `docker compose restart studio` yapın.)
    client_max_body_size 25m;

    # ── API proxy ────────────────────────────────────────────────────────────
    # `/api/` öneki soyulur: /api/auth/login → bff:7001/auth/login
    # Sondaki eğik çizgi (proxy_pass ... /) öneki soyan şeydir; silmeyin.
    location /api/ {
        proxy_pass         http://bff:7001/;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Analiz üretimi uzun sürebilir; varsayılan 60s erken keser.
        proxy_connect_timeout 10s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;

        # Sunucu-gönderimli olay akışı (canlı akış ekranı) tamponlanmamalı.
        proxy_buffering off;
        proxy_cache     off;
    }

    # ── Statik varlıklar ─────────────────────────────────────────────────────
    location ~* \.(js|css|woff2?|png|svg|jpg|jpeg|gif|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html asla önbelleğe alınmaz: yeni sürüm sonrası tarayıcı eski
    # bundle'ı isterse panel boş açılır.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA yönlendirmesi — /audit gibi derin bağlantılar index.html'e düşer.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Konteyner sağlık yoklaması (compose healthcheck bunu çağırır).
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
