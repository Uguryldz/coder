# Maestro — semgrep ÇEVRİMDIŞI başlangıç kural seti (6b tarama kapısı, M27).
#
# Tarayıcı konteynerinin ağı yoktur; kural indiremez. Bu dosya SCAN_RULES_VOLUME
# adlı birime konur ve SCAN_SEMGREP_RULES="/rules/semgrep.yml" ile okunur.
# Kurum kendi kural setini (semgrep registry'den indirilmiş p/ci vb.) aynı
# dosyaya koyabilir; buradaki kurallar "hiç kural yok" durumunun yerine geçen,
# dil-bağımsız, düşük yanlış-pozitifli bir tabandır.
rules:
  - id: maestro.js.eval-cagrisi
    languages: [javascript, typescript]
    severity: ERROR
    message: "eval() ile dinamik kod çalıştırma: girdiden gelen metin kod olur. JSON.parse ya da açık bir yorumlayıcı kullanın."
    patterns:
      - pattern: eval($X)
    metadata: { category: security, cwe: "CWE-95" }

  - id: maestro.js.new-function
    languages: [javascript, typescript]
    severity: ERROR
    message: "new Function() dinamik kod üretir; eval ile aynı risk."
    pattern: new Function(...)
    metadata: { category: security, cwe: "CWE-95" }

  - id: maestro.js.child-process-shell
    languages: [javascript, typescript]
    severity: ERROR
    message: "Kabuk üzerinden komut çalıştırma (exec/execSync) argüman enjeksiyonuna açıktır; execFile/spawn ile argüman listesi verin."
    pattern-either:
      - pattern: $CP.exec($CMD, ...)
      - pattern: $CP.execSync($CMD, ...)
      - pattern: exec($CMD, ...)
      - pattern: execSync($CMD, ...)
    metadata: { category: security, cwe: "CWE-78" }

  - id: maestro.js.sql-string-birlestirme
    languages: [javascript, typescript]
    severity: ERROR
    message: "SQL metni birleştirilerek kuruluyor; parametreli sorgu kullanın."
    pattern-either:
      - pattern: $DB.query("..." + $X, ...)
      - pattern: $DB.query(`...${$X}...`, ...)
      - pattern: $DB.execute("..." + $X, ...)
      - pattern: $DB.execute(`...${$X}...`, ...)
    metadata: { category: security, cwe: "CWE-89" }

  - id: maestro.js.tls-dogrulama-kapali
    languages: [javascript, typescript]
    severity: ERROR
    message: "TLS sertifika doğrulaması kapatılmış (rejectUnauthorized:false / NODE_TLS_REJECT_UNAUTHORIZED=0)."
    pattern-either:
      - pattern: |
          { ..., rejectUnauthorized: false, ... }
      - pattern: process.env.NODE_TLS_REJECT_UNAUTHORIZED = "0"
    metadata: { category: security, cwe: "CWE-295" }

  - id: maestro.genel.sabit-parola
    languages: [javascript, typescript, java, csharp, python, go]
    severity: ERROR
    message: "Kod içinde sabit parola/gizli anahtar görünüyor; sırlar SecretPort/Vault üzerinden referansla okunmalı."
    pattern-regex: '(?i)(password|passwd|pwd|secret|api[_-]?key|token)\s*[:=]\s*["''][A-Za-z0-9+/=_\-]{8,}["'']'
    metadata: { category: security, cwe: "CWE-798" }

  - id: maestro.java.runtime-exec
    languages: [java]
    severity: ERROR
    message: "Runtime.exec ile kabuk komutu; ProcessBuilder + argüman listesi ve girdi doğrulaması kullanın."
    pattern: Runtime.getRuntime().exec(...)
    metadata: { category: security, cwe: "CWE-78" }

  - id: maestro.java.sql-string-birlestirme
    languages: [java]
    severity: ERROR
    message: "Statement ile birleştirilmiş SQL; PreparedStatement kullanın."
    pattern-either:
      - pattern: $STMT.executeQuery("..." + $X)
      - pattern: $STMT.execute("..." + $X)
      - pattern: $STMT.executeUpdate("..." + $X)
    metadata: { category: security, cwe: "CWE-89" }

  - id: maestro.csharp.sql-string-birlestirme
    languages: [csharp]
    severity: ERROR
    message: "SqlCommand metni birleştirilerek kuruluyor; parametre kullanın."
    pattern-either:
      - pattern: new SqlCommand("..." + $X, ...)
      - pattern: new SqlCommand($"...", ...)
    metadata: { category: security, cwe: "CWE-89" }

  - id: maestro.python.eval-exec
    languages: [python]
    severity: ERROR
    message: "eval/exec ile dinamik kod çalıştırma."
    pattern-either:
      - pattern: eval(...)
      - pattern: exec(...)
    metadata: { category: security, cwe: "CWE-95" }

  - id: maestro.python.subprocess-shell
    languages: [python]
    severity: ERROR
    message: "subprocess shell=True komut enjeksiyonuna açıktır; argüman listesi verin."
    pattern: subprocess.$F(..., shell=True, ...)
    metadata: { category: security, cwe: "CWE-78" }

  - id: maestro.genel.todo-guvenlik-notu
    languages: [javascript, typescript, java, csharp, python, go]
    severity: WARNING
    message: "Güvenlikle ilgili açık bir TODO/FIXME bırakılmış; PR'da kapatılmalı."
    pattern-regex: '(?i)(TODO|FIXME).*(security|güvenlik|auth|yetki|şifre|password)'
    metadata: { category: maintainability }
