# Studio's static server.
#
# Port 8080, not 80: the image runs unprivileged and cannot bind a low port.
# The compose file publishes 7000 → 8080.

server {
    listen       8080;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # Studio holds no secrets, but it does render a bank's ticket data, so the
    # headers below are about what a compromised or embedded page could do
    # with it rather than about the files themselves.
    add_header X-Content-Type-Options   "nosniff"            always;
    add_header X-Frame-Options          "DENY"               always;
    add_header Referrer-Policy          "same-origin"        always;

    # Single-page app: every unknown path is a client-side route, not a 404.
    # `=404` on the final fallback would break a deep link on refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed assets are immutable by construction; index.html must not be, or a
    # deploy would leave browsers pinned to the previous bundle.
    location ~* \.(js|css|woff2?|png|svg|jpg|jpeg|gif|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # The container's own liveness probe. Served by nginx itself so it answers
    # even when the site has no files — which is what tells "nginx is up" apart
    # from "the build produced something".
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
